# FlurryPORT status page. This file goes into the repository flurryport/status as
# .upptimerc.yml (note the leading dot), replacing the template's sample content.
# Options: https://upptime.js.org/docs/configuration

owner: flurryport
repo: status

user-agent: flurryport

# Each route is public, needs no sign-in and changes nothing. Together they touch
# every service a customer depends on.
sites:
  - name: Website
    url: https://flurryport.io
    maxResponseTime: 5000
  - name: Pipes and Locker API
    url: https://api.flurryport.io/api/v1/locker/anchors
    maxResponseTime: 5000
  - name: Accounts and sign-in
    url: https://api.flurryport.io/api/v1/terms/current
    maxResponseTime: 5000
  - name: Billing
    url: https://api.flurryport.io/api/v1/billing/plans
    maxResponseTime: 5000
  - name: Recipes
    url: https://flurryport.io/recipes
    maxResponseTime: 5000
  - name: Trial
    url: https://flurryport.dev/try
    maxResponseTime: 5000

status-website:
  cname: status.flurryport.io
  name: FlurryPORT status
  logoUrl: https://flurryport.io/site/assets/Logo.png
  introTitle: "**FlurryPORT** status"
  introMessage: Checked every five minutes by GitHub, from outside our own servers. The full history is public in [this repository](https://github.com/flurryport/status).
  navbar:
    - title: Status
      href: /
    - title: FlurryPORT
      href: https://flurryport.io
    - title: History on GitHub
      href: https://github.com/$OWNER/$REPO

# We write the repository description ourselves.
skipDescriptionUpdate: true
